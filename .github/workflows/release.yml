name: Build public clients
on:
  push:
    branches: ["release/public-lite-*"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/windows-electron/package-lock.json
      - run: npm ci --prefix clients/windows-electron
      - run: node scripts/check-public-edition.mjs
      - run: npm test --prefix clients/windows-electron
      - run: npm run package:windows --prefix clients/windows-electron
      - name: Verify packaged Windows runtime
        timeout-minutes: 3
        shell: pwsh
        run: |
          $checkRoot = Join-Path $PWD "dist/windows-self-test"
          $resultPath = Join-Path $checkRoot "result.txt"
          Expand-Archive -Path "dist/windows/SMS-Success-Monitor-Windows-x64.zip" -DestinationPath $checkRoot -Force
          $exePath = Join-Path $checkRoot "SMS Success Monitor/SMS Success Monitor.exe"
          $env:SMS_MONITOR_LOCAL_AUTOMATION_CHECK = "1"
          $env:SMS_MONITOR_LOCAL_AUTOMATION_RESULT = $resultPath
          $process = Start-Process -FilePath $exePath -Wait -PassThru
          if (Test-Path $resultPath) { Get-Content $resultPath }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path $resultPath)) { throw "Missing runtime check result" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist/windows/SMS-Success-Monitor-Windows-x64.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and lint reduced Android client
        working-directory: clients/android
        run: ./gradlew :app:lintDebug :app:assembleDebug
      - name: Verify packaged manifest
        run: |
          APK=clients/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -q "package: name='com.local.smssuccessmonitor.publicworkbench'.*versionCode='104'.*versionName='0.3.83'" /tmp/badging.txt
          ! grep -E "SYSTEM_ALERT_WINDOW|POST_NOTIFICATIONS|FOREGROUND_SERVICE|RECEIVE_BOOT_COMPLETED" /tmp/badging.txt
          mkdir -p dist/android
          cp "$APK" dist/android/SMS-Success-Monitor-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: dist/android/SMS-Success-Monitor-Android.apk
          if-no-files-found: error
